name: Signed release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spacejam-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate version and release credentials
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          spacejam_version="$(cat VERSION)"
          [[ "$spacejam_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION" >&2; exit 1; }
          spacejam_existing="$(git ls-remote --tags origin "refs/tags/v${spacejam_version}")"
          [[ -z "$spacejam_existing" ]] || { echo "This version is already tagged. Bump VERSION first." >&2; exit 1; }
          for spacejam_secret in DEVELOPER_ID_CERTIFICATE_BASE64 DEVELOPER_ID_CERTIFICATE_PASSWORD DEVELOPER_ID_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            [[ -n "${!spacejam_secret}" ]] || { echo "Missing release secret: $spacejam_secret" >&2; exit 1; }
          done
          echo "SPACEJAM_RELEASE_VERSION=$spacejam_version" >> "$GITHUB_ENV"

      - name: Import signing certificate and notarization credentials
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          spacejam_certificate="$RUNNER_TEMP/spacejam-signing.p12"
          spacejam_keychain="$RUNNER_TEMP/spacejam-signing.keychain-db"
          spacejam_keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$spacejam_certificate"
          security create-keychain -p "$spacejam_keychain_password" "$spacejam_keychain"
          security set-keychain-settings -lut 3600 "$spacejam_keychain"
          security unlock-keychain -p "$spacejam_keychain_password" "$spacejam_keychain"
          security import "$spacejam_certificate" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$spacejam_keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$spacejam_keychain_password" "$spacejam_keychain" > /dev/null
          security list-keychains -d user -s "$spacejam_keychain"
          security default-keychain -d user -s "$spacejam_keychain"
          xcrun notarytool store-credentials SpaceJam-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$spacejam_keychain"
          rm -f "$spacejam_certificate"

      - name: Build, sign, and run tests
        env:
          SPACEJAM_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: python3 scripts/build.py --release

      - name: Notarize and package app and DMG
        run: |
          set -euo pipefail
          python3 scripts/package.py --notary-profile SpaceJam-notary
          bash -n scripts/install.sh
          ruby -c Casks/spacejam.rb

      - name: Save verified release artifacts for recovery
        uses: actions/upload-artifact@v4
        with:
          name: SpaceJam-${{ env.SPACEJAM_RELEASE_VERSION }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/SpaceJam-${{ env.SPACEJAM_RELEASE_VERSION }}-arm64.dmg
            dist/SpaceJam-arm64.zip
            dist/SHA256SUMS
            dist/release-manifest.json
            Casks/spacejam.rb

      - name: Update Homebrew cask, tag, and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || { echo "main changed during packaging; saved artifacts are available for review." >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/spacejam.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update Homebrew cask for SpaceJam $SPACEJAM_RELEASE_VERSION"
            git push origin HEAD:main
          fi
          spacejam_tag="v$SPACEJAM_RELEASE_VERSION"
          git tag -a "$spacejam_tag" -m "SpaceJam $SPACEJAM_RELEASE_VERSION"
          git push origin "$spacejam_tag"
          gh release create "$spacejam_tag" --verify-tag --draft --title "SpaceJam $SPACEJAM_RELEASE_VERSION" --notes-file docs/RELEASE_NOTES.md \
            "dist/SpaceJam-${SPACEJAM_RELEASE_VERSION}-arm64.dmg" dist/SpaceJam-arm64.zip dist/SHA256SUMS dist/release-manifest.json
          gh release edit "$spacejam_tag" --draft=false --latest

      - name: Remove temporary signing material
        if: always()
        run: |
          spacejam_keychain="$RUNNER_TEMP/spacejam-signing.keychain-db"
          if [[ -f "$spacejam_keychain" ]]; then security delete-keychain "$spacejam_keychain"; fi
          rm -f "$RUNNER_TEMP/spacejam-signing.p12"
